<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - i-Islam</title>

  <script type="module" src="http://127.0.0.1:3000/@vite/client"></script>
<script type="module" src="http://127.0.0.1:3000/resources/css/app.css"></script>
</head>
<body class="min-h-screen grid place-items-center bg-blue-50 p-4"> <div class="w-full max-w-md bg-blue-800 text-white shadow-2xl rounded-2xl p-8">
    
    <div class="text-center">
      <div class="mx-auto mb-3 w-20 h-20 grid place-items-center bg-white rounded-full shadow-lg">
        <svg class="w-12 h-12 text-blue-800" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </div>
      
      <h1 class="text-3xl font-bold text-white">i-Islam</h1>
      <p class="text-blue-200 text-sm">Learn, Play, and Grow with Islamic Knowledge</p>
    </div>

    <form id="registerForm" class="mt-8 space-y-4">
      
      <div>
        <label for="full_name" class="block text-sm font-medium text-blue-200">Full Name</label> <input type="text" id="full_name" name="full_name" required
               class="mt-1 block w-full px-4 py-3 border border-blue-600 rounded-lg shadow-sm focus:ring-blue-300 focus:border-blue-300 transition-all bg-blue-700 text-white placeholder-blue-300">
      </div>
      
      <div>
        <label for="matric_id" class="block text-sm font-medium text-blue-200">Matric ID</label>
        <input type="text" id="matric_id" name="matric_id" required
               class="mt-1 block w-full px-4 py-3 border border-blue-600 rounded-lg shadow-sm focus:ring-blue-300 focus:border-blue-300 transition-all bg-blue-700 text-white placeholder-blue-300">
      </div>
      
      <div>
        <label for="email" class="block text-sm font-medium text-blue-200">Email Address</label>
        <input type="email" id="email" name="email" required
               class="mt-1 block w-full px-4 py-3 border border-blue-600 rounded-lg shadow-sm focus:ring-blue-300 focus:border-blue-300 transition-all bg-blue-700 text-white placeholder-blue-300">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-blue-200">Create Password</label>
        <input type="password" id="password" name="password" required
               class="mt-1 block w-full px-4 py-3 border border-blue-600 rounded-lg shadow-sm focus:ring-blue-300 focus:border-blue-300 transition-all bg-blue-700 text-white placeholder-blue-300">
      </div>
      
      <div>
        <label for="role" class="block text-sm font-medium text-blue-200">I am a...</label>
        <select id="role" name="role" required
                class="mt-1 block w-full px-4 py-3 border border-blue-600 rounded-lg shadow-sm focus:ring-blue-300 focus:border-blue-300 transition-all bg-blue-700 text-white">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>

      <button type="submit" 
              class="w-full py-3 px-4 bg-cyan-400 text-blue-900 font-semibold rounded-lg shadow-lg hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-blue-800 transition-all transform hover:scale-105">
        Join i-Islam Adventure
      </button>

      <p id="formMessage" class="text-center text-sm font-medium h-4 text-cyan-300"></p>
      
      <p class="text-center text-sm text-blue-200">
        Already have an account? 
        <a href="login.html" class="font-medium text-cyan-300 hover:text-cyan-200">Log in here</a>
      </p>
    </form>

  </div>

  <script>
    // ... (The JavaScript code is the same as the previous step) ...
  </script>

</body>
</html>
